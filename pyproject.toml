[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradee"
version = "0.1.0"
description = "Reproducible crypto signal research — registry, market data, features, funding and paper execution"
requires-python = ">=3.11"
dependencies = ["python-dotenv==1.2.4"]

[project.optional-dependencies]
live = ["websockets>=16,<18"]
dashboard = ["fastapi==0.156.1", "uvicorn==0.54.0"]

[project.scripts]
tradee = "tradee.cli:main"

[tool.setuptools.packages.find]
include = ["tradee*"]
