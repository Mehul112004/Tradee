[project]
name = "tradee"
version = "0.1.0"
description = "Reproducible crypto signal research — instrument registry"
requires-python = ">=3.11"
dependencies = []


[project.scripts]
tradee = "tradee.cli:main"

[tool.setuptools.packages.find]
include = ["tradee*"]
