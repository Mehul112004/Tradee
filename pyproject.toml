[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradee"
version = "0.1.0"
description = "Reproducible crypto signal research — registry, market data and replay"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["websockets>=16,<18"]

[project.scripts]
tradee = "tradee.cli:main"

[tool.setuptools.packages.find]
include = ["tradee*"]
